[project]
name = "llm-rag"
version = "0.1.0"
description = "Simple RAG demo using local embeddings and Ollama-compatible generation."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sentence-transformers",
    "faiss-cpu",
    "openai",
    "requests"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

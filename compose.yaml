name: llm-rag

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$${OLLAMA_MODEL}"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  rag:
    build:
      context: .
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"
  
  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      rag:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  huggingface_cache:

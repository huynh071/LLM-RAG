<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Ask questions using a local RAG and Ollama system."
  >

  <title>RAG Assistant</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">R</div>

        <div>
          <h1>RAG Assistant</h1>
          <p>Powered by Ollama and your knowledge base</p>
        </div>
      </div>

      <div
        id="statusBadge"
        class="status-badge"
        data-state="checking"
      >
        <span class="status-dot"></span>
        <span id="statusText">Checking API</span>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="welcome" class="welcome">
        <div class="welcome-icon" aria-hidden="true">✦</div>

        <h2>How can I help?</h2>

        <p>
          Ask a question and I’ll find relevant information from the
          knowledge base before generating an answer.
        </p>

        <div class="suggestions">
          <button
            class="suggestion"
            type="button"
            data-prompt="What is the refund policy?"
          >
            <strong>Refund policy</strong>
            <span>Learn about returns and refunds</span>
          </button>

          <button
            class="suggestion"
            type="button"
            data-prompt="How long does shipping take?"
          >
            <strong>Shipping</strong>
            <span>Check expected delivery times</span>
          </button>

          <button
            class="suggestion"
            type="button"
            data-prompt="How can I contact customer support?"
          >
            <strong>Customer support</strong>
            <span>Find support contact details</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="composer-area">
      <form id="promptForm" class="composer">
        <label class="visually-hidden" for="prompt">
          Enter your question
        </label>

        <textarea
          id="prompt"
          name="prompt"
          rows="1"
          maxlength="4000"
          placeholder="Ask a question..."
          required
        ></textarea>

        <button
          id="sendButton"
          class="send-button"
          type="submit"
          aria-label="Send question"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            aria-hidden="true"
          >
            <path
              d="M3 20 21 12 3 4v6l13 2-13 2v6Z"
              fill="currentColor"
            />
          </svg>
        </button>
      </form>

      <p class="composer-help">
        Press Enter to send · Shift+Enter for a new line
      </p>
    </footer>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
